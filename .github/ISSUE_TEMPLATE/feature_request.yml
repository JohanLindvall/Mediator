# SPDX-License-Identifier: MIT

name: Feature request
description: Something it could do, or do better
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task you want to accomplish and who it helps. Search existing requests first; a small example makes the idea easier to discuss.
        Use invented media names. Do not include private library screenshots, signed URLs or credentials.
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation rather than the solution — what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: more
    attributes:
      label: Alternatives or workarounds
      description: What have you tried, and why does it fall short?

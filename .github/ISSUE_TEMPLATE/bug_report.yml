# SPDX-License-Identifier: MIT

name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and check the [troubleshooting guide](https://github.com/JohanLindvall/Mediator/blob/main/docs/troubleshooting.md) first.
        **Leave out real media names, personal paths, signed URLs and credentials.** Describe file shapes instead — "an MKV holding HEVC and two soundtracks". Do not attach private media or library screenshots.
        A security problem goes through [private reporting](https://github.com/JohanLindvall/Mediator/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open a film that …
        2. Seek to …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Copy the build version from Preferences or `/api/info`. Do not paste the full API response; it can contain a media token.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Published Docker image
        - Docker Compose
        - Locally built Docker image
        - Native source build
        - Other
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server OS and architecture
      placeholder: Linux amd64, macOS arm64, Windows amd64…
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser and device
      placeholder: Safari on an iPhone, Chrome on Windows, a television over DLNA …
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: Relevant lines from `docker compose logs --tail=100 mediator`, or a run with `-debug`. Remove real names, personal paths, signed media URLs and credentials before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed real library names, personal paths, signed URLs and credentials from this report.
          required: true

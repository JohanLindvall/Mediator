changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features and improvements
      labels: [enhancement, accessibility]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
